name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge upstream PiliPlus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        id: merge_upstream
        run: |
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          if ! git merge --no-ff --no-edit upstream/main; then
            echo "Merge conflict detected. Trying AutoClean safe conflict rules."

            safe_theirs_files=(
              ".fvmrc"
              "pubspec.yaml"
              "pubspec.lock"
              "lib/common/widgets/flutter/text_field/editable_text.dart"
              "lib/pages/common/publish/common_rich_text_pub_page.dart"
              "lib/http/video.dart"
              "lib/models/video/play/url.dart"
              "lib/pages/audio/controller.dart"
              "lib/pages/audio/view.dart"
              "lib/plugin/pl_player/controller.dart"
              "lib/utils/storage_pref.dart"
            )
            for file in "${safe_theirs_files[@]}"; do
              if git ls-files -u -- "$file" | grep -q .; then
                echo "Taking upstream version for safe non-AutoClean file: $file"
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done

            safe_ours_files=(
              "lib/scripts/patch.ps1"
              "lib/scripts/autoclean_upstream_hotfix.ps1"
              ".github/workflows/build.yml"
              ".github/workflows/sync-upstream.yml"
            )
            for file in "${safe_ours_files[@]}"; do
              if git ls-files -u -- "$file" | grep -q .; then
                echo "Keeping AutoClean local version for automation file: $file"
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            conflicted_files="$(git diff --name-only --diff-filter=U || true)"
            deleted_by_us="$(git diff --name-only --diff-filter=DU || true)"
            all_conflicts="$(printf '%s\n%s\n' "$conflicted_files" "$deleted_by_us" | sed '/^$/d' | sort -u)"
            echo "Remaining conflicts after AutoClean safe rules:"
            echo "$all_conflicts"

            non_workflow_conflicts="$(echo "$all_conflicts" | grep -v '^.github/workflows/' || true)"
            if [ -n "$non_workflow_conflicts" ]; then
              echo "Non-workflow conflicts still need manual resolution:"
              echo "$non_workflow_conflicts"
              git status --short
              exit 1
            fi

            echo "Keeping local AutoClean workflow customizations."
            git checkout --ours .github/workflows/build.yml .github/workflows/sync-upstream.yml || true
            git rm -f \
              .github/workflows/ios.yml \
              .github/workflows/linux_x64.yml \
              .github/workflows/mac.yml \
              .github/workflows/win_x64.yml || true
            git add .github/workflows
            git commit --no-edit
          fi

      - name: Remove non-AutoClean workflows
        if: steps.merge_upstream.outputs.changed == 'true'
        run: |
          find .github/workflows -type f \
            ! -name 'build.yml' \
            ! -name 'sync-upstream.yml' \
            -print -delete

      - name: Set up Flutter
        if: steps.merge_upstream.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply local Flutter patches
        if: steps.merge_upstream.outputs.changed == 'true'
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Commit local sync patches
        if: steps.merge_upstream.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Apply AutoClean sync patches"
          else
            echo "No local sync patches to commit."
          fi

      - name: Guard AutoClean customizations
        if: steps.merge_upstream.outputs.changed == 'true'
        shell: pwsh
        run: lib/scripts/guard_autoclean.ps1

      - name: Flutter pub get
        if: steps.merge_upstream.outputs.changed == 'true'
        run: flutter pub get

      - name: Flutter analyze
        if: steps.merge_upstream.outputs.changed == 'true'
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== Flutter analyze failed. Last 200 lines ====="
            tail -n 200 analyze.log
            exit "$status"
          fi

      - name: Push synced result
        if: steps.merge_upstream.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Dispatch Android build
        if: steps.merge_upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run build.yml --ref main; then
            echo "Android build dispatch requested."
          else
            echo "::warning::Failed to dispatch build.yml. Sync already pushed successfully; run Build AutoClean Android manually if no build starts."
          fi
