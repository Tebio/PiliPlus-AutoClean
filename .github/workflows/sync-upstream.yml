name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream PiliPlus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
          git fetch upstream main

          if ! git merge --no-ff --no-edit upstream/main; then
            echo "Merge conflict detected. Trying to keep local workflow customizations."

            conflicted_files="$(git diff --name-only --diff-filter=U || true)"
            echo "$conflicted_files"

            non_workflow_conflicts="$(echo "$conflicted_files" | grep -v '^.github/workflows/' || true)"
            if [ -n "$non_workflow_conflicts" ]; then
              echo "Non-workflow conflicts found. Manual resolution required:"
              echo "$non_workflow_conflicts"
              git status
              exit 1
            fi

            git checkout --ours .github/workflows
            git add .github/workflows
            git commit --no-edit
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply local Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Guard AutoClean customizations
        shell: pwsh
        run: lib/scripts/guard_autoclean.ps1

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Push synced result
        run: |
          git push origin HEAD:main
