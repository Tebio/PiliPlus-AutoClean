name: Build AutoClean

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  android:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Install Flutter 3.47.2 (git clone @ tag, patch-ready)
        # 2026-09-07: patch.ps1 要在 Flutter 框架源码里 cherry-pick hotfix commit +
        # git apply ~20 个 .patch，所以 FLUTTER_ROOT 必须是 flutter/flutter 的 git 仓库。
        # ① flutter-action 投错包（Dart 3.12.1≠官方 3.47.2 标配 3.13.2）②官方 tar.xz
        # 无 .git 让 cherry-pick 哑火——两条路都死过，改为自己 clone 精确 tag。
        run: |
          set -e
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git /tmp/flutter-sdk
          cd /tmp/flutter-sdk
          # patch.ps1 若声明了 cherry-pick 目标（$Xxx = "<40位sha>"），带父树补抓
          # （--depth 2：缺父树 cherry-pick 会退化成全文件 add/add 冲突，2026-09-07 实证）。
          # 随上游 patch.ps1 自动适应，不再硬编码 commit。
          for sha in $(grep -oE '"[0-9a-f]{40}"' "$GITHUB_WORKSPACE/lib/scripts/patch.ps1" | tr -d '"' | sort -u); do
            git fetch --depth 2 origin "$sha" || echo "warn: fetch $sha failed (可能已合入)"
          done
          git config --global --add safe.directory /tmp/flutter-sdk
          echo "/tmp/flutter-sdk/bin" >> "$GITHUB_PATH"
          # patch.ps1 依赖这个环境变量定位框架源码（flutter-action 原本会设置）
          echo "FLUTTER_ROOT=/tmp/flutter-sdk" >> "$GITHUB_ENV"
          # 工具自举 + 版本自证（官方 3.47.2 = Dart 3.13.2）
          /tmp/flutter-sdk/bin/flutter --version
          /tmp/flutter-sdk/bin/dart --version

      - name: Apply local Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write Android signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > android/key.properties
          fi

      - name: Set AutoClean version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Guard AutoClean customizations
        shell: pwsh
        run: lib/scripts/guard_autoclean.ps1

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=pili_release.json

      - name: Normalize APK name
        id: version
        shell: bash
        run: |
          shopt -s nullglob
          apk_files=(build/app/outputs/flutter-apk/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          apk_name="PiliPlus_autoclean_android_${version}_arm64-v8a.apk"
          release_tag="${version}"
          cp "${apk_files[0]}" "$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg tag_name "$release_tag" \
            --arg version_name "${version}" \
            --argjson version_code "${version_code}" \
            --arg apk_name "${apk_name}" \
            --arg download_url "https://github.com/Tebio/PiliPlus-AutoClean/releases/download/${release_tag}/${apk_name}" \
            '{
              tag_name: $tag_name,
              version_name: $version_name,
              version_code: $version_code,
              body: "AutoClean Android arm64-v8a build.",
              assets: [{
                name: $apk_name,
                browser_download_url: $download_url
              }]
            }' > update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: PiliPlus AutoClean ${{ env.version }}
          make_latest: true
          body: |
            AutoClean arm64-v8a Android + Windows x64 installer.

            Upstream version is recorded in pubspec.yaml and versionName.
          files: |
            ${{ env.apk_name }}
            update.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: Android_arm64-v8a
          path: ${{ env.apk_name }}

      - name: Report build failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const repoInfo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (!repoInfo.data.has_issues) {
              console.log('Issues disabled in this repository — skipping failure report.');
              return;
            }
            const title = '[Build Failure] AutoClean';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'AutoClean 构建失败。',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- Commit: \`${context.sha}\``,
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Trigger: \`${context.eventName}\``,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
