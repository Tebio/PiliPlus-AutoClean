name: Build AutoClean Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply local Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write Android signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > android/key.properties
          fi

      - name: Set AutoClean version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=pili_release.json

      - name: Normalize APK name
        shell: bash
        run: |
          shopt -s nullglob
          apk_files=(build/app/outputs/flutter-apk/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          apk_name="PiliPlus_AutoClean_android_${version}_arm64-v8a.apk"
          cp "${apk_files[0]}" "$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_ENV"
          echo "release_tag=autoclean-${version}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: PiliPlus AutoClean ${{ env.version }}
          body: |
            AutoClean Android arm64-v8a build.

            Upstream version is recorded in pubspec.yaml and versionName.
          files: ${{ env.apk_name }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_arm64-v8a
          path: ${{ env.apk_name }}
