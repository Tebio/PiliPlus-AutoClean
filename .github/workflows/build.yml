name: Build AutoClean

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  android:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply local Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write Android signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > android/key.properties
          fi

      - name: Set AutoClean version
        id: version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Guard AutoClean customizations
        shell: pwsh
        run: lib/scripts/guard_autoclean.ps1

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=pili_release.json

      - name: Normalize APK name
        shell: bash
        run: |
          shopt -s nullglob
          apk_files=(build/app/outputs/flutter-apk/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          apk_name="PiliPlus_autoclean_android_${version}_arm64-v8a.apk"
          release_tag="${version}"
          cp "${apk_files[0]}" "$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg tag_name "$release_tag" \
            --arg version_name "${version}" \
            --argjson version_code "${version_code}" \
            --arg apk_name "${apk_name}" \
            --arg download_url "https://github.com/Tebio/PiliPlus-AutoClean/releases/download/${release_tag}/${apk_name}" \
            '{
              tag_name: $tag_name,
              version_name: $version_name,
              version_code: $version_code,
              body: "AutoClean Android arm64-v8a build.",
              assets: [{
                name: $apk_name,
                browser_download_url: $download_url
              }]
            }' > update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: PiliPlus AutoClean ${{ env.version }}
          make_latest: true
          body: |
            AutoClean arm64-v8a Android + Windows x64 installer.

            Upstream version is recorded in pubspec.yaml and versionName.
          files: |
            ${{ env.apk_name }}
            update.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_arm64-v8a
          path: ${{ env.apk_name }}

  windows:
    name: Build Windows x64
    needs: android
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Apply patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Install fastforge + Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup --no-progress

      - name: Add Chinese language for Inno Setup
        shell: pwsh
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -ErrorAction SilentlyContinue

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json"

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Windows_portable_x64
          path: build/windows/x64/runner/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows_setup_x64
          path: dist/**/*.exe

      - name: Add Windows exe to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.android.outputs.release_tag }}
          make_latest: false
          files: |
            dist/**/*.exe

      - name: Report build failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Build Failure] AutoClean';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'AutoClean 构建失败。',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- Commit: \`${context.sha}\``,
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Trigger: \`${context.eventName}\``,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
